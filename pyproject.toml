[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfsentinel"
dynamic = ["version"]
description = "Automated pfSense backup management tool"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
authors = [{ name = "nx1x" }]
keywords = ["pfsense", "backup", "firewall", "network", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.15.0,<1",
    # click is imported directly (cli/commands/notify.py, cli/commands/device.py);
    # declare it explicitly since typer >=0.26 no longer pulls it transitively.
    "click>=8.3.3,<9",
    "rich>=13.9.0,<14",
    "pydantic>=2.10.0,<3",
    "paramiko>=5,<6",
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3,<7",
    "cryptography>=48.0.1,<49",
    "loguru>=0.7,<1",
    "packaging>=24.0,<25",
    "requests>=2.34.2,<3",
    # urllib3: transitive via requests/httpx; floor enforces CVE-2026-44431 / CVE-2026-44432 fix (>=2.7.0)
    "urllib3>=2.7.0,<3",
    "keyring>=25.0,<26",
    "keyrings.alt>=5.0,<6",
    "lxml>=6.1.1,<7",
    "schedule>=1.2,<2",
    # defusedxml: hardens config.xml parsing against XXE / entity-expansion attacks
    "defusedxml>=0.7.1,<1",
]

[project.urls]
Homepage = "https://github.com/NX1X/pfSentinel"
Repository = "https://github.com/NX1X/pfSentinel"
"Bug Tracker" = "https://github.com/NX1X/pfSentinel/issues"
Changelog = "https://github.com/NX1X/pfSentinel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<0.12",
    "pytest>=9,<10",
    "pytest-cov>=6.0.0,<7",
    "responses>=0.25.0,<1",
    "mypy>=1.14.0,<2",
    "types-paramiko>=3.5.0,<4",
    "types-pyyaml>=6.0.0,<7",
    "pip-audit>=2.7.0,<3",
    "pip-tools>=7.4.0,<8",
    "bandit[toml]>=1.8,<2",
    # release/build tools — kept in dev so a single hash-verified lockfile
    # covers every CI job (lint, test, security-audit, build-*).
    "build>=1.2,<2",
    "twine>=6.0,<7",
    "pyinstaller>=6.10,<7",
    "winotify>=1.1.0,<2; sys_platform == 'win32'",
    # PEP 517 backend + editable helper, included so
    # `pip install -e . --no-build-isolation` works after the lockfile install
    # (Windows CI blocks pip's isolated fetch).
    "hatchling>=1.25,<2",
    "editables>=0.5,<1",
]

[project.scripts]
pfs = "pfsentinel.cli.app:main_entry"

[tool.hatch.version]
path = "src/pfsentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pfsentinel"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# "S" = flake8-bandit (inline SAST). High-value rules (hardcoded secrets,
# shell=True, pickle, weak hashes, requests verify=False, SQL injection) stay on;
# the noisy always-fires ones are ignored below.
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S"]
ignore = [
    "UP040", "B904", "B008", "B017", "SIM102", "SIM105", "SIM108", "SIM117",
    "E501", "F841", "E402",
    # flake8-bandit noise: every subprocess.run (S603) and partial-path exec
    # (S607) fires regardless of safety, and best-effort try/except/pass (S110)
    # is an intentional pattern here. All subprocess calls use list args, no shell.
    "S603", "S607", "S110",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts, throwaway credentials, and temp files.
"tests/**" = ["S101", "S105", "S106", "S107", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["pfsentinel"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end (real local SSH server; deselect with '-m \"not e2e\"')",
]
addopts = "--strict-markers"
filterwarnings = [
    # The e2e suite uses the project's default WarningPolicy on a fresh
    # 127.0.0.1 fake SSH server. Production-correct behavior; not what we
    # are testing.
    "ignore:Unknown .* host key for \\[127\\.0\\.0\\.1\\]:UserWarning:paramiko.client",
]

[tool.coverage.run]
source = ["pfsentinel"]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
