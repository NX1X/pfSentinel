name: Docker (experimental)

# Builds the experimental container image and runs a smoke test.
# It does NOT publish anything. See the commented section at the bottom.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'requirements-dev.lock'
      - 'deploy/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Every FROM line must carry a digest (project rule: pin by digest).
      - name: Check that every base image is pinned by digest
        run: |
          set -eu
          bad=$(grep -E '^FROM ' Dockerfile | grep -v '@sha256:[0-9a-f]\{64\}' || true)
          if [ -n "$bad" ]; then
            echo "::error::FROM line without a sha256 digest:"
            echo "$bad"
            exit 1
          fi

      # No third-party action: plain docker on the runner.
      - name: Build image
        run: docker build --tag pfsentinel:ci .

      - name: Smoke test (version and help)
        run: |
          set -eu
          docker run --rm pfsentinel:ci --version
          docker run --rm pfsentinel:ci --help > /dev/null

      - name: Smoke test (hardened run, as the user would deploy it)
        run: |
          set -eu
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint id pfsentinel:ci -u | grep -qx 10001
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            pfsentinel:ci config path

      - name: Report image size
        run: docker image ls pfsentinel:ci

  # ---------------------------------------------------------------------------
  # Publishing to ghcr.io (amd64 and arm64, with an attestation) is in
  # docker-publish.yml. This workflow only checks that the image builds.
  # ---------------------------------------------------------------------------
