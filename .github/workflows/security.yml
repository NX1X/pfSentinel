name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Bandit — Python SAST (insecure patterns: subprocess, weak crypto, etc.)
  # ---------------------------------------------------------------------------
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Bandit
        run: pip install "bandit[toml]>=1.8,<2"

      - name: Run Bandit
        run: bandit -c pyproject.toml -r src/ --severity-level medium --confidence-level medium

  # ---------------------------------------------------------------------------
  # 2. zizmor — GitHub Actions workflow security auditor
  # ---------------------------------------------------------------------------
  zizmor:
    name: zizmor (Actions audit)
    runs-on: ubuntu-latest
    # Non-blocking for now: surfaces findings in the Security tab for review
    # before being promoted to a required check.
    continue-on-error: true

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install zizmor
        run: pip install "zizmor>=1.5,<2"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: zizmor --persona regular --format sarif . > zizmor.sarif

      - name: Upload zizmor SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # ---------------------------------------------------------------------------
  # 3. Dependency Review — block PRs adding vulnerable / bad-license deps
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # 4. OSV-Scanner — scan the pinned lockfile against the OSV vulnerability DB
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Scan requirements.lock against OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=requirements.txt:requirements.lock
