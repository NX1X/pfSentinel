# SonarQube Cloud (SonarCloud) project configuration.
# Only overrides / ignore rules; project key + org come from the SonarCloud org settings.

sonar.projectKey=NX1X_pfSentinel
sonar.organization=nx1x

# ---------------------------------------------------------------------------
# Rule ignore rules
# ---------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=e1,e2

# githubactions:S8541 — "Omitting --only-binary :all: can lead to execution of setup scripts."
# We install our own editable package (hatchling backend, no setup.py) plus dev
# tools bounded in pyproject.toml. Supply-chain risk on those installs is
# already handled by:
#   - a hash-verified `pip install --require-hashes -r requirements.lock`
#     step in the Security Audit job,
#   - OSV-Scanner and dependency-review workflows,
#   - SHA-pinned actions (sha_pinning_required=true at the repo level).
# `--only-binary :all:` would block our own editable install; splitting every
# `pip install` into deps-only + editable is churn without new safety.
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/**

# githubactions:S8544 — "Using dependencies without locking resolved versions."
# All runtime deps ARE locked in requirements.lock with hashes and verified in
# CI (see the "Verify dependency hashes against lock file" step in ci.yml).
# The `pip install` lines Sonar flags install our editable package or dev-only
# tools (ruff, pyinstaller, twine, build) that are floor+ceiling pinned in
# pyproject.toml and separately covered by Renovate PRs. Layered defense
# already meets the intent of the rule.
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/**
