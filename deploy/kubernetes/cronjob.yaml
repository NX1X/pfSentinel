# EXPERIMENTAL. See docs/docker.md.
#
# Daily pfSentinel backup as a Kubernetes CronJob.
# No Secret object is used: device credentials live in the encrypted store
# on the config PVC (see "One-time setup" in docs/docker.md).
#
# Before you apply this file:
#   1. Check the image. It is the published 1.0.0-rc.1 (amd64 and arm64),
#      pinned by digest. To check its build attestation, run:
#        gh attestation verify oci://ghcr.io/nx1x/pfsentinel:1.0.0-rc.1 --repo NX1X/pfSentinel
#      For your own build, put its tag and digest here instead.
#   2. Run the one-time setup (deploy/kubernetes/setup-pod.yaml).
#   3. Adjust storageClassName and sizes if your cluster needs it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pfsentinel-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pfsentinel-config
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pfsentinel-backup
spec:
  schedule: "0 2 * * *"          # every day at 02:00 (cluster time zone)
  concurrencyPolicy: Forbid      # two runs must never share the volumes
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pfsentinel
              # Published 1.0.0-rc.1, pinned by digest. Change tag and digest together.
              image: ghcr.io/nx1x/pfsentinel:1.0.0-rc.1@sha256:504f6889bb7f95eaeab12dfc0a3d7a1cf173ec20dd93d38e5221c36f782d48ac
              args: ["backup", "run", "--non-interactive"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
                  ephemeral-storage: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /home/pfs/.pfsentinel
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pfsentinel-data
            - name: config
              persistentVolumeClaim:
                claimName: pfsentinel-config
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
